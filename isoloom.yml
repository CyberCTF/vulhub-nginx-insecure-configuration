# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Nginx Misconfigurations (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's nginx/insecure-configuration, vendored in build/nginx/app/, on the published image
# vulhub/nginx:1 with Vulhub's mounted configuration, files and web root copied in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-nginx-insecure-configuration

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.61.0/24, internet: false}

machines:
  nginx:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      crlf:
        port: 8080
        protocol: http
        publish: true
      alias:
        port: 8081
        protocol: http
        publish: true
      headers:
        port: 8082
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/nginx

checks:
  - name: the CRLF server redirects
    http: http://nginx:8080/
    expect: 302
    wait: 60
  - name: the add_header server answers
    http: http://nginx:8082/
  - name: the alias server lists /files/
    script: checks/alias.sh

message: |
  nginx answers on three ports: {{ machines.nginx.ports.crlf.url }} (redirects),
  {{ machines.nginx.ports.alias.url }}files/ (an alias) and
  {{ machines.nginx.ports.headers.url }} (security headers). Read each one's configuration mistake.
