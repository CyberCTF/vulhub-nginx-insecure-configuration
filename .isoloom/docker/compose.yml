# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: vulhub-nginx-insecure-configuration
services:
  nginx:
    build:
      context: ../../build/nginx
      labels:
        isoloom.managed: 'true'
        isoloom.environment: vulhub-nginx-insecure-configuration
    image: isoloom/vulhub-nginx-insecure-configuration-nginx
    platform: linux/amd64
    hostname: nginx
    networks:
      lab:
        ipv4_address: 10.60.61.10
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8080}:8080
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8081}:8081
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8082}:8082
    volumes:
    - nginx-ctf:/ctf
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8080 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8081 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8082
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    labels:
      isoloom.service.crlf: http:8080
      isoloom.service.alias: http:8081
      isoloom.service.headers: http:8082
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
    restart: unless-stopped
  nginx-routes:
    image: alpine:3.20
    network_mode: service:nginx
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
  nginx-init-1:
    image: isoloom/vulhub-nginx-insecure-configuration-nginx
    entrypoint:
    - /bin/sh
    - /isoloom/init/flag.sh
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - nginx-ctf:/ctf
    network_mode: service:nginx
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    depends_on:
      nginx:
        condition: service_healthy
      nginx-routes:
        condition: service_healthy
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      nginx:
        condition: service_healthy
      nginx-init-1:
        condition: service_completed_successfully
      nginx-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
  isoloom-check-nginx:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/nginx.sh:/isoloom/run.sh:ro
    network_mode: service:nginx
    depends_on:
      nginx:
        condition: service_healthy
      nginx-init-1:
        condition: service_completed_successfully
      nginx-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.61.0/24
        gateway: 10.60.61.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
volumes:
  nginx-ctf:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: vulhub-nginx-insecure-configuration
